<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" />

  <!-- Ground Grid Line -->
  <line x1="64" y1="390" x2="448" y2="390" stroke="rgba(56, 189, 248, 0.3)" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Bar 1 (Left - Small) -->
  <g filter="url(#neon)">
    <!-- Shadow -->
    <ellipse cx="140" cy="392" rx="38" ry="10" fill="rgba(0,0,0,0.6)" />
    <!-- Main Body -->
    <rect x="108" y="270" width="64" height="120" rx="10" fill="url(#bar1)" />
    <!-- Cap -->
    <rect x="104" y="262" width="72" height="14" rx="4" fill="url(#glow)" />
  </g>

  <!-- Bar 2 (Center - Medium) -->
  <g filter="url(#neon)">
    <!-- Shadow -->
    <ellipse cx="256" cy="392" rx="42" ry="10" fill="rgba(0,0,0,0.6)" />
    <!-- Main Body -->
    <rect x="224" y="190" width="64" height="200" rx="10" fill="url(#bar2)" />
    <!-- Cap -->
    <rect x="220" y="182" width="72" height="14" rx="4" fill="url(#glow)" />
  </g>

  <!-- Bar 3 (Right - High / Sorted Peak) -->
  <g filter="url(#neon)">
    <!-- Shadow -->
    <ellipse cx="372" cy="392" rx="46" ry="10" fill="rgba(0,0,0,0.6)" />
    <!-- Main Body -->
    <rect x="340" y="100" width="64" height="290" rx="10" fill="url(#bar3)" />
    <!-- Cap -->
    <rect x="336" y="92" width="72" height="14" rx="4" fill="url(#glow)" />
  </g>

  <!-- Audio Wave Arc Over Pillars -->
  <path d="M 108 220 C 180 140, 320 60, 400 70" fill="none" stroke="rgba(251, 191, 36, 0.7)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8" />
  <circle cx="400" cy="70" r="7" fill="#fbbf24" filter="url(#neon)" />
</svg>
